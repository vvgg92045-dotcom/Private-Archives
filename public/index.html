<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Archive ULTIMATE</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}

/* NAV */
.topbar{display:flex;justify-content:space-around;padding:10px;background:#000;position:fixed;top:0;width:100%;z-index:100}
.tab{opacity:.5;cursor:pointer}
.tab.active{opacity:1;font-weight:bold}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;margin-top:60px}
.grid video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px}
.selected{outline:3px solid #00ff88}

/* BG */
#bgVideo{position:fixed;width:100%;height:100%;object-fit:cover;z-index:-1;opacity:.25}

/* FEED */
.feed{display:none;position:fixed;width:100%;height:100%;background:black;z-index:999}
.feed video{width:100%;height:100%;object-fit:contain}

/* UI */
.back,.sound{position:absolute;width:45px;height:45px;background:rgba(0,0,0,.6);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.back{top:20px;left:20px}
.sound{top:20px;right:20px}
.like,.fav{position:absolute;right:20px;font-size:30px;cursor:pointer}
.like{bottom:140px}
.fav{bottom:90px}
#views{position:absolute;bottom:60px;right:20px;font-size:14px}
#progress{position:absolute;bottom:0;height:5px;background:#00ff88;width:0%}

/* SEARCH */
.searchPage{display:none;margin-top:60px}
.searchInput{width:100%;padding:15px;background:#111;color:#fff;border:none}

/* PROFILE */
.profile{display:none;margin-top:60px;text-align:center}
.profile img{width:120px;border-radius:50%}

/* BUTTONS */
#highlightBtn,#voteBtn{position:fixed;left:50%;transform:translateX(-50%);padding:10px 20px;border:none;border-radius:10px;z-index:200}
#highlightBtn{bottom:90px;background:#00ff88}
#voteBtn{bottom:40px;background:#ff0077;color:#fff}
#installBtn{position:fixed;bottom:20px;right:20px;padding:10px;background:#00ff88;color:#000;border:none;border-radius:10px;display:none}
</style>
</head>
<body>
<video id="bgVideo" muted autoplay loop></video>

<div class="topbar">
 <div class="tab active" onclick="switchTab('foryou',this)">For You</div>
 <div class="tab" onclick="switchTab('sub',this)">Abonniert</div>
 <div class="tab" onclick="switchTab('trending',this)">Trending</div>
 <div class="tab" onclick="switchTab('search',this)">Suche</div>
 <div class="tab" onclick="switchTab('profile',this)">Profil</div>
</div>

<div id="foryou" class="grid"></div>
<div id="sub" class="grid" style="display:none"></div>
<div id="trending" class="grid" style="display:none"></div>

<div id="searchPage" class="searchPage">
 <input class="searchInput" placeholder="Suche" oninput="search(this.value)">
 <div id="searchGrid" class="grid"></div>
</div>

<div id="profile" class="profile">
 <h2 id="username"></h2>
 <input id="nameInput" placeholder="Name"><br><br>
 <input type="file" id="imgUpload"><br><br>
 <input type="color" id="borderColor"><br><br>
 <button onclick="saveProfile()">Speichern</button>
</div>

<button id="highlightBtn" onclick="createHighlight()">Highlight</button>
<button id="voteBtn" onclick="startVote()">Vote</button>

<div class="feed" id="feed">
 <div class="back" onclick="closeFeed()">Back</div>
 <div class="sound" onclick="toggleSound()">Sound</div>
 <video id="video"></video>
 <div class="like" onclick="like()">Like</div>
 <div class="fav" onclick="fav()">Fav</div>
 <div id="views"></div>
 <div id="progress"></div>
</div>

<button id="installBtn">Install</button>

<script>
const uploads = '/api/videos';
let allVideos = [], index = 0, selectedVideos = [];
let likes = {}, views = {}, favs = {};
const video = document.getElementById("video");

async function load() {
  const res = await fetch(uploads);
  const data = await res.json();
  allVideos = data.files.map(f => ({ v: f }));
  loadGrid();
  startBG();
}

function loadGrid(){
  const grid = document.getElementById("foryou");
  grid.innerHTML="";
  allVideos.forEach((v,i)=>{
    let vid = document.createElement("video");
    vid.src = `/api/videos/${v.v}`;
    vid.muted = true; vid.preload = "metadata";
    vid.onclick = ()=>{ vid.classList.toggle("selected"); };
    vid.ondblclick = ()=>openFeed(i);
    grid.appendChild(vid);
  });
}

function startBG(){
  if(!allVideos.length) return;
  const bgVideo = document.getElementById("bgVideo");
  let i=0;
  function playNext(){ bgVideo.src=`/api/videos/${allVideos[i].v}`; bgVideo.play(); i=(i+1)%allVideos.length; }
  bgVideo.onended = playNext;
  playNext();
}

function openFeed(i){ index=i; document.getElementById("feed").style.display="block"; play(); }
function play(){ video.src=`/api/videos/${allVideos[index].v}`; video.play(); }
function closeFeed(){ video.pause(); video.src=""; document.getElementById("feed").style.display="none"; }
function toggleSound(){ video.muted=!video.muted; }
function like(){likes[index]=(likes[index]||0)+1;}
function fav(){favs[index]=true;}
video.onplay=()=>views[index]=(views[index]||0)+1;

function switchTab(tab,el){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active")); el.classList.add("active");
  ["foryou","sub","trending","searchPage","profile"].forEach(id=>document.getElementById(id).style.display="none");
  if(tab==="foryou") document.getElementById("foryou").style.display="grid";
  if(tab==="search") document.getElementById("searchPage").style.display="block";
  if(tab==="profile") document.getElementById("profile").style.display="block";
}

window.onload=load;
</script>
</body>
</html>
