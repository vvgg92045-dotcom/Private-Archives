<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Archive ULTIMATE</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
/* NAV */
.topbar{display:flex;justify-content:space-around;padding:10px;background:#000;position:fixed;top:0;width:100%;z-index:100;}
.tab{opacity:.5;cursor:pointer}.tab.active{opacity:1;font-weight:bold}
/* GRID */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;margin-top:60px;}
.grid video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px}
.selected{outline:3px solid #00ff88}
/* BG */
#bgVideo{position:fixed;width:100%;height:100%;object-fit:cover;z-index:-1;opacity:.25}
/* FEED */
.feed{display:none;position:fixed;width:100%;height:100%;background:black;z-index:999}
.feed video{width:100%;height:100%;object-fit:contain}
/* UI */
.back,.sound{position:absolute;width:45px;height:45px;background:rgba(0,0,0,.6);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.back{top:20px;left:20px}.sound{top:20px;right:20px}
.like,.fav{position:absolute;right:20px;font-size:30px;cursor:pointer}
.like{bottom:140px}.fav{bottom:90px}
#views{position:absolute;bottom:60px;right:20px;font-size:14px}
#progress{position:absolute;bottom:0;height:5px;background:#00ff88;width:0%}
/* SEARCH */
.searchPage{display:none;margin-top:60px}
.searchInput{width:100%;padding:15px;background:#111;color:#fff;border:none}
/* PROFILE */
.profile{display:none;margin-top:60px;text-align:center}
.profile img{width:120px;border-radius:50%}
/* BUTTONS */
#highlightBtn,#voteBtn{position:fixed;left:50%;transform:translateX(-50%);padding:10px 20px;border:none;border-radius:10px;z-index:200}
#highlightBtn{bottom:90px;background:#00ff88}
#voteBtn{bottom:40px;background:#ff0077;color:#fff}
#installBtn{position:fixed;bottom:20px;right:20px;padding:10px;background:#00ff88;color:#000;border:none;border-radius:10px;display:none}
</style>
</head>
<body>

<video id="bgVideo" muted autoplay loop></video>

<div class="topbar">
 <div class="tab active" onclick="switchTab('foryou',this)">For You</div>
 <div class="tab" onclick="switchTab('sub',this)">Abonniert</div>
 <div class="tab" onclick="switchTab('trending',this)">Trending</div>
 <div class="tab" onclick="switchTab('search',this)">Suche</div>
 <div class="tab" onclick="switchTab('profile',this)">Profil</div>
</div>

<div id="foryou" class="grid"></div>
<div id="sub" class="grid" style="display:none"></div>
<div id="trending" class="grid" style="display:none"></div>

<div id="searchPage" class="searchPage">
 <input class="searchInput" placeholder="🔍 Suche" oninput="search(this.value)">
 <div id="searchGrid" class="grid"></div>
</div>

<div id="profile" class="profile">
 <h2 id="username"></h2>
 <input id="nameInput" placeholder="Name"><br><br>
 <input type="file" id="imgUpload"><br><br>
 <input type="color" id="borderColor"><br><br>
 <button onclick="saveProfile()">Speichern</button>
</div>

<button id="highlightBtn" onclick="createHighlight()">✨ Highlight</button>
<button id="voteBtn" onclick="startVote()">🏆 Vote</button>

<div class="feed" id="feed">
 <div class="back" onclick="closeFeed()">⏎</div>
 <div class="sound" onclick="toggleSound()">🔊</div>
 <video id="video"></video>
 <div class="like" onclick="like()">❤️</div>
 <div class="fav" onclick="fav()">⭐</div>
 <div id="views"></div>
 <div id="progress"></div>
</div>

<button id="installBtn">Install</button>

<script>
const video = document.getElementById("video");
let data = {}, allVideos = [], index = 0, selectedVideos = [];
let likes = {}, views = {}, favs = {};

async function load() {
  const res = await fetch('/api/channels');
  data = await res.json();
  Object.keys(data).forEach(ch => data[ch].forEach(v => allVideos.push({ ch, v })));
  startBG();
  loadGrid();
}

function startBG() {
  let vids = allVideos.map(v => v.v);
  let i = 0;
  function playNext() { bgVideo.src = vids[i]; bgVideo.play(); i = (i + 1) % vids.length; }
  bgVideo.onended = playNext;
  playNext();
}

function loadGrid() {
  foryou.innerHTML = "";
  allVideos.forEach((v,i)=>{
    let vid = document.createElement("video");
    vid.src = v.v;
    vid.muted = true;
    vid.preload = "metadata";
    vid.onclick = ()=>{
      if(selectedVideos.includes(i)){ selectedVideos = selectedVideos.filter(x=>x!==i); vid.classList.remove("selected"); }
      else { selectedVideos.push(i); vid.classList.add("selected"); }
    };
    vid.ondblclick = ()=>openFeed(i);
    foryou.appendChild(vid);
  });
}

/* FEED */
function openFeed(i){ index=i; feed.style.display="block"; play(); enterFullscreen(); }
function play(){ let v=allVideos[index]; video.src=v.v; video.play(); }
function closeFeed(){ video.pause(); video.src=""; feed.style.display="none"; if(document.fullscreenElement) document.exitFullscreen(); }
function toggleSound(){ video.muted=!video.muted; }
function like(){likes[index]=(likes[index]||0)+1;}
function fav(){favs[index]=true;}
video.onplay=()=>views[index]=(views[index]||0)+1;
video.ontimeupdate=()=>progress.style.width=(video.currentTime/video.duration*100)+"%";

/* SWIPE */
let startY=0;
feed.addEventListener("touchstart",e=>startY=e.touches[0].clientY);
feed.addEventListener("touchend",e=>{
  let endY=e.changedTouches[0].clientY;
  if(startY-endY>50) next();
  if(endY-startY>50) prev();
});
function next(){index=(index+1)%allVideos.length;play();}
function prev(){index=(index-1+allVideos.length)%allVideos.length;play();}

/* HIGHLIGHT */
async function createHighlight(){ if(selectedVideos.length<2){alert("Mind. 2 Videos!"); return;} const canvas=document.createElement("canvas"); const ctx=canvas.getContext("2d"); const stream=canvas.captureStream(30); const rec=new MediaRecorder(stream); let chunks=[]; rec.ondataavailable=e=>chunks.push(e.data); rec.onstop=()=>{ const url=URL.createObjectURL(new Blob(chunks)); let v=document.createElement("video"); v.src=url;v.controls=true;v.autoplay=true; v.style.position="fixed"; v.style.width="80%"; v.style.top="50%"; v.style.left="50%"; v.style.transform="translate(-50%,-50%)"; document.body.appendChild(v); }; rec.start(); for(let i of selectedVideos){ await clip(i,ctx,canvas); } rec.stop(); selectedVideos=[]; }
function clip(i,ctx,canvas){ return new Promise(res=>{ let v=document.createElement("video"); let d=allVideos[i]; v.src=d.v; v.muted=true; v.preload="auto"; v.onloadeddata=()=>{ canvas.width=v.videoWidth; canvas.height=v.videoHeight; v.currentTime=v.duration*0.3; v.play(); let start=null; function draw(t){ if(!start) start=t; if(v.readyState>=2) ctx.drawImage(v,0,0,canvas.width,canvas.height); if((t-start)/1000<2.5){ requestAnimationFrame(draw); }else{ v.pause(); res(); } } requestAnimationFrame(draw); }; }); }

/* VOTE */
function startVote(){ if(selectedVideos.length<2){alert("2 Videos wählen!"); return;} let a=selectedVideos[0],b=selectedVideos[1]; let v1=allVideos[a],v2=allVideos[b]; let box=document.createElement("div"); box.style.position="fixed"; box.style.width="100%"; box.style.height="100%"; box.style.display="flex"; box.innerHTML=`<video src="${v1.v}" style="width:50%" autoplay muted></video><video src="${v2.v}" style="width:50%" autoplay muted></video>`; box.onclick=e=>{ alert("Gewählt!"); box.remove(); }; document.body.appendChild(box); }

/* PROFILE */
function saveProfile(){ localStorage.setItem("username",nameInput.value); username.innerText=nameInput.value; }

/* TABS */
function switchTab(tab,el){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  foryou.style.display="none"; sub.style.display="none"; trending.style.display="none"; searchPage.style.display="none"; profile.style.display="none";
  if(tab==="foryou") foryou.style.display="grid";
  if(tab==="search") searchPage.style.display="block";
  if(tab==="profile") profile.style.display="block";
}

/* PWA */
let deferredPrompt;
installBtn.onclick=()=>deferredPrompt.prompt();
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; installBtn.style.display="block"; });

window.onload = load;
</script>

</body>
</html>
