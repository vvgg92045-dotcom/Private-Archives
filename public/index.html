<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Archive - TikTok Kanal</title>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111">
<style>
/* --- Global --- */
body { margin:0; font-family:'Helvetica Neue', sans-serif; background:#111; color:#fff; overflow:hidden; }
.content { display:flex; flex-wrap:wrap; justify-content:center; padding:20px; transition: all 0.3s; }
.channel-card { width:150px; margin:15px; text-align:center; cursor:pointer; transition: transform 0.25s, box-shadow 0.25s; }
.channel-card:hover { transform: scale(1.08); box-shadow:0 4px 15px rgba(0,0,0,0.6); }
.channel-card img { width:100%; border-radius:50%; border:2px solid #fff; }
.channel-card span { display:block; margin-top:8px; font-size:16px; font-weight:bold; }

/* --- Grid für Kanalvideos --- */
.video-grid { display:none; grid-template-columns: repeat(3, 1fr); gap:15px; padding:20px; transition: all 0.3s; }
.video-grid video { width:100%; height:auto; cursor:pointer; border-radius:12px; transition: transform 0.25s; }
.video-grid video:hover { transform: scale(1.03); }

/* --- Banner --- */
.banner { display:none; position:relative; width:100%; height:200px; overflow:hidden; margin-bottom:15px; border-bottom:1px solid #333; border-radius:10px; }
.banner .banner-overlay { position:absolute; top:0; left:0; width:100%; height:100%; filter: blur(15px) brightness(0.35); transition: all 0.3s; }
.banner .name { position:absolute; bottom:15px; left:20px; font-size:28px; font-weight:bold; color:#fff; text-shadow:0 0 10px rgba(0,0,0,0.7); }

/* --- Kleiner Player --- */
#channelPlayer { display:none; width:320px; height:180px; margin:15px auto; object-fit:cover; border-radius:12px; box-shadow:0 0 20px rgba(0,0,0,0.7); transition: all 0.3s; }

/* --- Feed Vollbild --- */
.feed { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:50; overflow:hidden; }
.feed video { width:100%; height:100%; object-fit:contain; background:#000; transition: opacity 0.3s; }

/* --- Buttons --- */
.back-arrow, .back-to-home { position:absolute; top:20px; left:15px; width:50px; height:50px; background:rgba(0,0,0,0.4); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; color:white; cursor:pointer; z-index:55; box-shadow:0 0 10px rgba(0,0,0,0.5); transition: all 0.3s; }
.back-arrow:hover, .back-to-home:hover { background:rgba(0,0,0,0.6); transform: scale(1.1); }

body::-webkit-scrollbar { width:0; }
</style>
</head>
<body>

<!-- Startseite -->
<div class="content" id="content">
<h1 style="width:100%; text-align:center; margin-bottom:20px;">🎬 Private Archive</h1>
</div>

<!-- Banner -->
<div class="banner" id="banner">
  <div class="banner-overlay"></div>
  <div class="name" id="bannerName"></div>
  <div class="back-to-home" id="backToHome">←</div>
</div>

<!-- Video Grid -->
<div class="video-grid" id="videoGrid"></div>

<!-- Kleiner Player -->
<video id="channelPlayer" autoplay muted></video>

<!-- Vollbild Feed -->
<div class="feed" id="feed">
  <div class="back-arrow" id="backArrow">←</div>
  <video id="feedVideo" autoplay muted></video>
</div>

<script>
// --- Globals ---
const uploadsPath = "uploads/";
let data = {}, activeChannel = "", currentVideoIndex = 0;
const content = document.getElementById("content");
const videoGrid = document.getElementById("videoGrid");
const banner = document.getElementById("banner");
const bannerOverlay = banner.querySelector(".banner-overlay");
const bannerName = document.getElementById("bannerName");
const channelPlayer = document.getElementById("channelPlayer");
const feed = document.getElementById("feed");
const feedVideo = document.getElementById("feedVideo");
const backArrow = document.getElementById("backArrow");
const backToHome = document.getElementById("backToHome");

// --- Load Channels ---
async function loadChannels(){
  try{
    const res = await fetch('/api/channels');
    data = await res.json();
    showChannels();
  } catch(e){ console.error(e); }
}

// --- Show Channels ---
function showChannels(){
  content.style.display="flex";
  banner.style.display="none";
  videoGrid.style.display="none";
  feed.style.display="none";
  channelPlayer.style.display="none";

  content.innerHTML = '<h1 style="width:100%; text-align:center; margin-bottom:20px;">🎬 Private Archive</h1>';
  Object.keys(data).forEach(channel=>{
    const card = document.createElement("div"); card.className="channel-card";
    const img = document.createElement("img"); img.src=`${uploadsPath}${channel}/profile.jpg`;
    img.onerror = ()=>{ img.src="https://res.cloudinary.com/do5gpmvvg/image/upload/f_auto,q_auto/profile_pygvp9"; }
    const name = document.createElement("span"); name.innerText = channel;
    card.appendChild(img); card.appendChild(name);
    card.onclick = ()=>openChannel(channel);
    content.appendChild(card);
  });
}

// --- Open Channel ---
function openChannel(channel){
  activeChannel = channel;
  content.style.display="none";
  feed.style.display="none";
  videoGrid.style.display="grid";
  channelPlayer.style.display="none";

  banner.style.background = `url('${uploadsPath}${channel}/profile.jpg') center/cover no-repeat`;
  bannerOverlay.style.filter = "blur(15px) brightness(0.35)";
  bannerName.innerText = channel;
  banner.style.display="block";

  videoGrid.innerHTML="";
  data[channel].forEach((v,i)=>{
    const vid = document.createElement("video");
    vid.src = `${uploadsPath}${channel}/${v}`;
    vid.onclick = ()=>openFeed(i);
    vid.onmouseenter = ()=>playChannelPreview(v);
    videoGrid.appendChild(vid);
  });
}

// --- Preview ---
function playChannelPreview(video){
  channelPlayer.src = `${uploadsPath}${activeChannel}/${video}`;
  channelPlayer.style.display="block";
  channelPlayer.currentTime = 0;
  channelPlayer.muted = true;
  channelPlayer.play();
}

// --- Feed Vollbild ---
function openFeed(index){
  currentVideoIndex = index;
  content.style.display="none";
  videoGrid.style.display="none";
  banner.style.display="none";
  channelPlayer.style.display="none";
  feed.style.display="block";
  playVideo();
}

function playVideo(){
  feedVideo.src = `${uploadsPath}${activeChannel}/${data[activeChannel][currentVideoIndex]}`;
  feedVideo.currentTime = 0;
  feedVideo.muted = false;
  feedVideo.play();
}

function nextVideo(){ currentVideoIndex=(currentVideoIndex+1)%data[activeChannel].length; playVideo(); }
function prevVideo(){ currentVideoIndex=(currentVideoIndex-1+data[activeChannel].length)%data[activeChannel].length; playVideo(); }

// --- Swipe ---
let startY=0;
feed.addEventListener("touchstart", e=>{ startY=e.touches[0].clientY; });
feed.addEventListener("touchend", e=>{
  let endY=e.changedTouches[0].clientY;
  if(startY-endY>50) nextVideo();
  if(endY-startY>50) prevVideo();
});

// --- Buttons ---
backArrow.onclick = ()=>{ feedVideo.pause(); feedVideo.src=""; openChannel(activeChannel); }
backToHome.onclick = ()=>{ videoGrid.style.display="none"; banner.style.display="none"; channelPlayer.style.display="none"; content.style.display="flex"; }

window.onload = loadChannels;
</script>
</body>
</html>
